[package]
name = "qbcli"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.15.0", features = ["rustls-0_23"]}
anyhow = "1.0.103"
base64 = "0.23.0"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0"
dotenvy = "0.15.7"
http = "1.4.2"
indoc = "2.0.7"
oo7 = { version = "0.6.0", features = ["tracing"] }
opener = "0.8.5"
openid = { version = "0.24", default-features = false, features = ["rustls"] }
# openid = { path="../openid", default-features = false, features = ["rustls"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["rustls"]} #, default-features = false }
rustls = "0.23"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
